# Production deployment: the agent (hosting mode) behind Caddy with automatic HTTPS.
#
#   cp deploy/.env.example deploy/.env      # set DOMAIN
#   cp .env.example .env                    # set MODEL_* / API keys / APP_* limits
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# Only Caddy is published (80/443). The app has no published port, so it is reachable
# solely through Caddy, which is what makes APP_TRUST_PROXY=true safe.

name: ai-agents

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file: ../.env
    environment:
      APP_MODE: host
      APP_TRUST_PROXY: "true"
      APP_COOKIE_SECURE: "true"
      APP_DB_PATH: /data/app.db
    volumes:
      - app-data:/data
    # Lets the container reach Ollama running on the host:
    # set MODEL_API_BASE=http://host.docker.internal:11434 in .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    # Hardening: the agent runs model-written code, so give it as little as possible.
    read_only: true
    tmpfs:
      - /tmp:size=256m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    pids_limit: 256
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  caddy:
    image: caddy:2.10-alpine
    depends_on:
      app:
        condition: service_healthy
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  app-data:     # accounts database: back this up
  caddy-data:   # TLS certificates
  caddy-config:
